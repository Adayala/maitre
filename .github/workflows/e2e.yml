name: End-to-end

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Detect affected applications
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      e2e: ${{ steps.detect.outputs.e2e }}
      has_deploy: ${{ steps.detect.outputs.has_deploy }}
      has_e2e: ${{ steps.detect.outputs.has_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        name: Build selective test and deployment matrices
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            result="$(node tooling/deployment/detect-affected.mjs --all </dev/null)"
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            fi
            result="$(git diff --name-only "$base" "$HEAD_SHA" | node tooling/deployment/detect-affected.mjs)"
          fi
          echo "deploy=$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.deploy))' "$result")" >> "$GITHUB_OUTPUT"
          echo "e2e=$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.e2e))' "$result")" >> "$GITHUB_OUTPUT"
          echo "has_deploy=$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(String(value.has_deploy))' "$result")" >> "$GITHUB_OUTPUT"
          echo "has_e2e=$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(String(value.has_e2e))' "$result")" >> "$GITHUB_OUTPUT"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Static quality and architecture
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run deps:check
          npm run deploy:affected:test
          npm run coverage:gate:test
          npm run e2e:journey:policy
          npm run e2e:journey:policy:test
          npm run sdd:validate
          npm run openapi:check
          npm run openapi:breaking
      - name: Unit tests and coverage
        run: npm run test:coverage
      - name: Security controls
        run: |
          npm run secrets:scan
          npm run security:audit
      - name: Frontend bundle budgets
        run: npm run performance:budget
      - name: Generate software bill of materials
        run: npm sbom --sbom-format cyclonedx > maitre-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: quality-evidence-${{ github.run_attempt }}
          path: |
            maitre-sbom.json
            coverage/
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: E2E · ${{ matrix.label }}
    if: needs.affected.outputs.has_e2e == 'true'
    needs: affected
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected.outputs.e2e) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace apps/api

      - name: Build ${{ matrix.label }}
        run: npm run build --workspace ${{ matrix.workspace }}
        env:
          VITE_API_URL: http://127.0.0.1:3101

      - name: Run ${{ matrix.label }} end-to-end tests
        run: npm run test:e2e:run -- --project=${{ matrix.app }}
        env:
          CI: "true"
          E2E_APP: ${{ matrix.app }}

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.app }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-gate:
    name: E2E gate
    if: ${{ always() }}
    needs: [affected, playwright]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every affected Playwright project
        env:
          HAS_E2E: ${{ needs.affected.outputs.has_e2e }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          if [[ "$HAS_E2E" == "true" && "$PLAYWRIGHT_RESULT" != "success" ]]; then
            echo "Affected E2E projects did not all pass: $PLAYWRIGHT_RESULT"
            exit 1
          fi
          echo "E2E gate passed (affected=$HAS_E2E, result=$PLAYWRIGHT_RESULT)."

  deploy:
    name: Deploy · ${{ matrix.name }}
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.affected.outputs.has_deploy == 'true' &&
      needs.quality.result == 'success' &&
      needs.e2e-gate.result == 'success'
    needs: [affected, quality, e2e-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected.outputs.deploy) }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_cvlEbUCNF87Ldam2yzMhKBkc
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
      - name: Deploy after all required checks
        run: |
          npx --yes vercel@57 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@57 deploy --prod --yes --token="$VERCEL_TOKEN"
